model:
  name: unsloth/Qwen3.5-4B
  max_seq_length: 2048
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  gradient_checkpointing: unsloth

datasets:
  - dataset_name: LocalLLaMA/typed-decisions
    name: all
    train_split: train
    # Use eval_split/test_split for named splits, or fractions to split the train data.
    eval_fraction: 0.2
    test_split: test
    # weight: 1.0
output: outputs/qwen-decision
merged_output: outputs/qwen-decision-merged
device: auto
seed: 3407

training:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  warmup_steps: 10
  num_train_epochs: 2
  max_steps: 60
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  weight_decay: 0.01
  eval_strategy: epoch
  logging_steps: 10
  disable_tqdm: false
